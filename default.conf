
server {
    listen 90 ssl;
    server_name www.erp.iuufu.com;

    ssl_certificate     /etc/nginx/ssl/www.erp.iuufu.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.erp.iuufu.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/unified-access.log;
    error_log  /var/log/nginx/unified-error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
}